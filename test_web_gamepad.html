<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Gamepad API - Vibración Web</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .gamepad {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            margin: 15px 0;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .gamepad h3 {
            margin-top: 0;
            font-size: 1.5em;
        }
        .info {
            margin: 10px 0;
            font-size: 1.1em;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            text-align: center;
            padding: 20px;
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        .warning {
            background: rgba(255, 193, 7, 0.2);
            border: 2px solid rgba(255, 193, 7, 0.5);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .success {
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid rgba(76, 175, 80, 0.5);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        .slider-container {
            margin: 15px 0;
        }
        .slider-container label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }
        .value-display {
            text-align: right;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Test Gamepad API - Vibración Web</h1>
        
        <div class="status" id="status">
            🔍 Presiona cualquier botón en tu gamepad para conectarlo...
        </div>

        <div class="warning">
            <strong>⚠️ Nota:</strong> La Gamepad API solo funciona con interacción del usuario.
            Presiona un botón en tu gamepad para detectarlo.
        </div>

        <div id="gamepads"></div>
    </div>

    <script>
        let connectedGamepads = {};

        // Función para formatear el ID del gamepad
        function getGamepadName(gamepad) {
            const id = gamepad.id.toLowerCase();
            if (id.includes('xbox')) return '🎮 Xbox Controller';
            if (id.includes('dualshock') || id.includes('wireless controller')) return '🎮 DualShock 4';
            if (id.includes('dualsense')) return '🎮 DualSense';
            if (id.includes('joy-con')) return '🎮 Joy-Con';
            return '🎮 ' + gamepad.id.substring(0, 50);
        }

        // Función de vibración
        async function vibrate(gamepad, duration, weak, strong) {
            if (!gamepad.vibrationActuator) {
                alert('❌ Este gamepad no soporta vibración');
                return;
            }

            try {
                await gamepad.vibrationActuator.playEffect('dual-rumble', {
                    startDelay: 0,
                    duration: duration,
                    weakMagnitude: weak,
                    strongMagnitude: strong
                });
                console.log(`✅ Vibración exitosa: weak=${weak}, strong=${strong}, duration=${duration}ms`);
            } catch (error) {
                console.error('❌ Error al vibrar:', error);
                alert('❌ Error: ' + error.message);
            }
        }

        // Actualizar lista de gamepads
        function updateGamepadDisplay() {
            const gamepadsDiv = document.getElementById('gamepads');
            const gamepads = navigator.getGamepads();
            const statusDiv = document.getElementById('status');

            // Limpiar
            gamepadsDiv.innerHTML = '';
            let connectedCount = 0;

            for (let i = 0; i < gamepads.length; i++) {
                const gamepad = gamepads[i];
                if (!gamepad) continue;

                connectedCount++;

                const div = document.createElement('div');
                div.className = 'gamepad';

                const hasVibration = gamepad.vibrationActuator !== undefined && gamepad.vibrationActuator !== null;

                div.innerHTML = `
                    <h3>${getGamepadName(gamepad)}</h3>
                    <div class="info">📍 Index: ${gamepad.index}</div>
                    <div class="info">🔌 ID: <code>${gamepad.id}</code></div>
                    <div class="info">📳 Vibración: ${hasVibration ? '✅ Soportada' : '❌ No soportada'}</div>
                    <div class="info">🎮 Botones: ${gamepad.buttons.length} | Ejes: ${gamepad.axes.length}</div>
                    
                    ${hasVibration ? `
                        <div class="slider-container">
                            <label>💪 Motor fuerte (Strong):</label>
                            <input type="range" min="0" max="100" value="80" id="strong-${i}">
                            <div class="value-display"><span id="strong-val-${i}">80</span>%</div>
                        </div>
                        
                        <div class="slider-container">
                            <label>🌀 Motor débil (Weak):</label>
                            <input type="range" min="0" max="100" value="80" id="weak-${i}">
                            <div class="value-display"><span id="weak-val-${i}">80</span>%</div>
                        </div>

                        <div class="buttons">
                            <button onclick="testVibration(${i}, 500)">
                                📳 Corto (500ms)
                            </button>
                            <button onclick="testVibration(${i}, 1000)">
                                📳 Medio (1s)
                            </button>
                            <button onclick="testVibration(${i}, 2000)">
                                📳 Largo (2s)
                            </button>
                            <button onclick="testPattern(${i})">
                                🎵 Patrón
                            </button>
                            <button onclick="testOnlyStrong(${i})">
                                💪 Solo Fuerte
                            </button>
                            <button onclick="testOnlyWeak(${i})">
                                🌀 Solo Débil
                            </button>
                        </div>
                    ` : '<div class="warning">⚠️ Este gamepad no soporta vibración en la API web</div>'}
                `;

                gamepadsDiv.appendChild(div);

                // Listeners para sliders
                if (hasVibration) {
                    const strongSlider = document.getElementById(`strong-${i}`);
                    const weakSlider = document.getElementById(`weak-${i}`);
                    const strongVal = document.getElementById(`strong-val-${i}`);
                    const weakVal = document.getElementById(`weak-val-${i}`);

                    strongSlider.oninput = function() {
                        strongVal.textContent = this.value;
                    };
                    weakSlider.oninput = function() {
                        weakVal.textContent = this.value;
                    };
                }
            }

            if (connectedCount === 0) {
                statusDiv.innerHTML = '🔍 No hay gamepads conectados. Presiona un botón en tu gamepad...';
            } else {
                statusDiv.innerHTML = `✅ ${connectedCount} gamepad${connectedCount > 1 ? 's' : ''} conectado${connectedCount > 1 ? 's' : ''}`;
            }
        }

        // Funciones de test
        window.testVibration = async function(index, duration) {
            const gamepad = navigator.getGamepads()[index];
            if (!gamepad) return;

            const strong = parseFloat(document.getElementById(`strong-${index}`).value) / 100;
            const weak = parseFloat(document.getElementById(`weak-${index}`).value) / 100;

            await vibrate(gamepad, duration, weak, strong);
        };

        window.testOnlyStrong = async function(index) {
            const gamepad = navigator.getGamepads()[index];
            if (!gamepad) return;

            const strong = parseFloat(document.getElementById(`strong-${index}`).value) / 100;
            await vibrate(gamepad, 1000, 0, strong);
        };

        window.testOnlyWeak = async function(index) {
            const gamepad = navigator.getGamepads()[index];
            if (!gamepad) return;

            const weak = parseFloat(document.getElementById(`weak-${index}`).value) / 100;
            await vibrate(gamepad, 1000, weak, 0);
        };

        window.testPattern = async function(index) {
            const gamepad = navigator.getGamepads()[index];
            if (!gamepad) return;

            // Patrón: corto-pausa-corto-pausa-largo
            await vibrate(gamepad, 200, 1.0, 1.0);
            await new Promise(resolve => setTimeout(resolve, 300));
            await vibrate(gamepad, 200, 1.0, 1.0);
            await new Promise(resolve => setTimeout(resolve, 300));
            await vibrate(gamepad, 800, 1.0, 1.0);
        };

        // Event listeners
        window.addEventListener('gamepadconnected', (e) => {
            console.log('✅ Gamepad conectado:', e.gamepad.id);
            updateGamepadDisplay();
        });

        window.addEventListener('gamepaddisconnected', (e) => {
            console.log('❌ Gamepad desconectado:', e.gamepad.id);
            updateGamepadDisplay();
        });

        // Polling para detectar gamepads
        setInterval(() => {
            updateGamepadDisplay();
        }, 1000);

        // Inicializar
        updateGamepadDisplay();
    </script>
</body>
</html>
