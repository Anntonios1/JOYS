<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamepad Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-4xl font-bold">🎮 Gamepad Monitor</h1>
            <div class="flex gap-4">
                <button id="scanBtn" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg font-semibold transition">
                    🔍 Scan Devices
                </button>
                <button id="resetBtBtn" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-semibold transition">
                    🔄 Reset Bluetooth
                </button>
            </div>
        </div>

        <!-- Connection Status -->
        <div id="connectionStatus" class="mb-6 p-4 bg-gray-800 rounded-lg">
            <div class="flex items-center gap-2">
                <div id="wsIndicator" class="w-3 h-3 rounded-full bg-gray-500"></div>
                <span id="wsStatus">Connecting to server...</span>
            </div>
        </div>

        <!-- Devices Grid -->
        <div id="devicesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
            <!-- Device cards will be inserted here -->
        </div>

        <!-- Scanning Indicator -->
        <div id="scanningIndicator" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
            <div class="bg-gray-800 p-8 rounded-lg text-center">
                <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-blue-500 mx-auto mb-4"></div>
                <p class="text-xl">Scanning for devices...</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
